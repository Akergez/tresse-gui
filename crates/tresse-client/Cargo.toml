[package]
name = "tresse-client"
description = "Tresse for the filesystem: a folder's history and its sync, over a vault seam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tresse-lib = { git = "https://gitlab.com/ragusseven/tresse.git", branch = "master" }
rdx-rs = { git = "https://gitlab.com/ragusseven/tresse.git", branch = "master" }
rdx-sync = { git = "https://gitlab.com/ragusseven/tresse.git", branch = "master" }
rdx-sync-s3 = { git = "https://gitlab.com/ragusseven/tresse.git", branch = "master" }
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
uuid = { version = "1.11", features = ["v4"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
