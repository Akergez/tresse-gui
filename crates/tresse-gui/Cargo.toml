[package]
name = "tresse-gui"
description = "Folders versioned and synchronized with Tresse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# A shared object as well, which is what an Android activity loads.
[lib]
crate-type = ["lib", "cdylib"]

[build-dependencies]
# Links the icon into the Windows executable (`build.rs`). The same crate,
# at the same version, that GPUI embeds its manifest with.
embed-resource = "3"

[dependencies]
tresse-client = { path = "../tresse-client" }
gpui-kit = "0.7.0"
# The design system the window is drawn with: its intents, primitives,
# colours and scale (github.com/Akergez/gpui-mobile-components). gpui-kit's
# components are what it is made of, not what this crate calls; see
# `tests/design_system.rs`.
gpui-adaptive = { git = "https://github.com/Akergez/gpui-mobile-components", tag = "v0.5.8" }
# The theme's colours: a Material You scheme made from the system's colour.
gpui-adaptive-colors = { git = "https://github.com/Akergez/gpui-adaptive-colors", branch = "main" }
# The Android side shared with Money Manager and the other applications:
# android_main, the status bar, the insets, back. Every function of it also
# exists off Android. Its Java half is `com.akergez.gpui:android-glue` in
# android/app/build.gradle.kts, at the same version.
gpui-android-glue = { git = "https://github.com/Akergez/gpui-android-glue", tag = "v0.5.3" }
dirs = "6"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "android")'.dependencies]
# With no subscriber, events go to `log`, and from there to logcat.
tracing = { workspace = true, features = ["log"] }
# The deep links the Tresse server's connect page returns through. The same
# revision gpui-android-glue builds against, so one copy of the platform ends
# up in the library.
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/Akergez/gpui-mobile", rev = "a331bf40413d50b35be5e1b181bc7f4c26b5ea6e" }
# The Java calls the storage vault makes, and the syscall it flocks with.
jni = "0.22.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
