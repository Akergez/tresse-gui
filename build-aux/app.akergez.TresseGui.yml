id: app.akergez.TresseGui
# The plain freedesktop runtime: the interface draws itself through GPUI on
# Vulkan and needs nothing from GTK.
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: tresse-gui

# The folders the person syncs are theirs, wherever they keep them: the
# sandbox sees home, and the application writes only inside the folders it
# was given and its own settings. Nothing else is touched.
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  # Syncing a folder with its storage.
  - --share=network

modules:
  - name: tresse-gui
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/tresse-gui/cargo
      # This repository builds from crates.io rather than from a generated
      # offline source list: it is published from our own CI, not Flathub,
      # so a network-isolated build buys nothing but a megabyte of churn in
      # cargo-sources.json on every dependency bump.
      build-args:
        - --share=network
    build-commands:
      # The default sync server is baked in at build time; the build sandbox
      # gets no environment from outside, so publish-flatpak.sh leaves it in
      # this file of the checkout.
      - TRESSE_SERVER_URL="$(cat .tresse-server-url 2>/dev/null)" cargo build --profile dist --locked -p tresse-gui
      - install -Dm755 target/dist/tresse-gui /app/bin/tresse-gui
      - install -Dm644 data/app.akergez.TresseGui.desktop /app/share/applications/app.akergez.TresseGui.desktop
      - install -Dm644 data/app.akergez.TresseGui.metainfo.xml /app/share/metainfo/app.akergez.TresseGui.metainfo.xml
      # The icon ships rasterized. Both `flatpak build-export` and
      # appstreamcli load icons through glycin, which has no SVG loader in the
      # images this is built on, so an exported SVG fails the build outright. The
      # source of truth is still the SVG in data/.
      - rsvg-convert -w 128 -h 128 -o icon-128.png
        data/icons/hicolor/scalable/apps/app.akergez.TresseGui.svg
      - rsvg-convert -w 256 -h 256 -o icon-256.png
        data/icons/hicolor/scalable/apps/app.akergez.TresseGui.svg
      - install -Dm644 icon-128.png
        /app/share/icons/hicolor/128x128/apps/app.akergez.TresseGui.png
      - install -Dm644 icon-256.png
        /app/share/icons/hicolor/256x256/apps/app.akergez.TresseGui.png
    sources:
      - type: dir
        path: ..
        # Everything the publish script itself writes into the checkout. The
        # ostree repository and the builder's state directory are large; the
        # state directory also holds live mounts, which cannot be copied.
        skip:
          - .git
          - .flatpak-build
          - .flatpak-repo
          - .flatpak-state
          - .cargo-home
          - dist
          - target
